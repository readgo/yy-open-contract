openapi: 3.0.3
info:
  title: yy-open API
  version: 0.1.0
  description: |
    Management API for the yy-open vending platform: the organisation tree,
    operator accounts and the sign-in flow. All traffic is JSON over HTTPS.

    **Authentication.** Send `Authorization: Bearer <accessToken>` on every
    request except `POST /api/v1/auth/login`. A request without the header
    answers 401 with `AUTH_REQUIRED`; an expired token answers 401 with
    `AUTH_TOKEN_EXPIRED`; an invalid or revoked one answers 401 with
    `AUTH_TOKEN_INVALID`. Sign in again to obtain a new token.

    **Authorisation.** A token says who the caller is, not what it may do. Every
    account holds one or more roles, and a role grants a set of permission points
    such as `account:create`. An endpoint the caller may not use answers 403 with
    `PERMISSION_DENIED`. `GET /api/v1/auth/me` returns the caller's own permission
    list: a client should decide what to show from that list rather than from the
    role names, because a role's contents can change.

    A fresh installation has two roles. `administrator` holds every permission and
    `operator` holds only the `:read` points. Both belong to the root group, so
    they are visible everywhere, and only an administrator of the root group can
    change them. A group may define its own roles, which are visible inside that
    group's subtree and changeable by the administrators of that group alone.

    **Response envelope.** Every response carries `ok` and `traceId`. On success
    `data` holds the payload; on failure `error` holds `code`, `message` and
    optional `details`.

    **Branch on `error.code`, not the HTTP status.** Status is emitted with its
    usual meaning for proxies and logs, but client logic must decide on the code.
    `error.message` is an English diagnostic for developers and is never shown to
    an end user - translate `error.code` instead.

    **Time.** Timestamps are RFC 3339 in UTC with a trailing `Z`. Values are
    stored and returned in UTC; the console renders them in the signed-in
    account's time zone, which is why accounts carry a `timezone` field.

    **Collections.** List endpoints take `limit` and `offset` and return `total`
    next to `items`.
servers:
  - url: /
    description: Paths below already include the /api/v1 prefix.

tags:
  - name: auth
    description: |
      Sign-in and the caller's own profile. The token issued here authorises
      every other endpoint.
  - name: groups
    description: |
      The organisation tree. Every account belongs to exactly one group. A
      group's code is assigned by the server - three digits per level - so the
      code itself carries the position under its parent.
  - name: accounts
    description: |
      Operator accounts: status, password, display name, time zone and the roles
      they hold. Visibility follows the caller's own group and includes its
      descendants.
  - name: roles
    description: |
      Roles and the permission points they grant. A role belongs to one group and
      is visible inside that group's subtree, so the root group's roles are the
      ones every account can be given. Nobody can create a role that grants more
      than they hold themselves: that is the rule that stops a limited
      administrator from promoting themselves.

security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Exchange credentials for an access token
      description: |
        The only endpoint that does not require a token. Wrong credentials answer
        401 with `AUTH_INVALID_CREDENTIALS`; a disabled account answers 403 with
        `ACCOUNT_DISABLED`.

        The response carries the token, its lifetime in seconds and the identity
        it belongs to, so a client does not need a second request after signing
        in.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the identity behind the current token
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      operationId: updateProfile
      summary: Change the caller's own display name or time zone
      description: >
        Self-service only: it always applies to the account behind the token, so a
        signed-in operator can fix their own name and clock without asking somebody
        with a wider scope. Username, group and status are not part of the body.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/me/password:
    put:
      operationId: changeOwnPassword
      summary: Change the caller's own password
      description: >
        The current password is required, so a borrowed session cannot silently
        take over the account. A successful change revokes every other token and
        returns a fresh one, which keeps the caller signed in while signing out
        whatever else was using the old password.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed, new token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/groups/tree:
    get:
      operationId: getGroupTree
      summary: Return the visible group tree in pre-order
      description: >
        Nodes are ordered by code with the C collation, which is exactly pre-order.
        The result is flat; the client assembles the tree from parentId. Only the
        subtree the caller may see is returned.
      tags: [groups]
      responses:
        '200':
          description: Flat pre-ordered node list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupNodeListEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/groups/{groupId}/children:
    get:
      operationId: listGroupChildren
      summary: List direct children and preview the next available code
      tags: [groups]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Children plus code preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChildrenEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/groups:
    post:
      operationId: createGroup
      summary: Create a child group
      description: >
        When `code` is omitted the server allocates the next free three-digit
        slot under the parent. Deleted siblings keep their code, so numbers are
        never reused.
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupNodeEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/groups/{groupId}:
    patch:
      operationId: updateGroup
      summary: Rename, enable, disable or annotate a group
      description: Code and parent are immutable here; moving is a separate operation.
      tags: [groups]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupNodeEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: deleteGroup
      summary: Delete an empty group
      description: Rejected when the group has children or accounts.
      tags: [groups]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/groups/{groupId}/move:
    post:
      operationId: moveGroup
      summary: Move a group and its whole subtree under a new parent
      description: >
        The subtree is renumbered in a single transaction: every descendant's
        code has the old prefix replaced by the new one. Relative order inside
        the subtree is preserved.
      tags: [groups]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveGroupRequest'
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupNodeEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/groups/{groupId}/reorder:
    post:
      operationId: reorderGroup
      summary: Swap a group with the sibling above or below it
      description: >
        Siblings are ordered by their three digit slot, so moving one step is a
        swap of slots. Both subtrees are renumbered with the same prefix
        rewrite a move uses, which keeps pre-order equal to code order. The first
        sibling cannot move up and the last one cannot move down; both are
        rejected rather than silently ignored.
      tags: [groups]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderGroupRequest'
      responses:
        '200':
          description: Reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupNodeEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: List accounts inside the visible subtree
      tags: [accounts]
      parameters:
        - name: groupCode
          in: query
          description: Return accounts under this code prefix. Omit for the whole visible scope.
          schema:
            type: string
        - name: withDescendants
          in: query
          description: Include groups below groupCode. Defaults to true.
          schema:
            type: boolean
            default: true
        - name: keyword
          in: query
          description: Case-insensitive match on username or display name.
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: offset
          in: query
          description: >
            Number of rows to skip. Together with limit this is page * limit, so the
            caller can jump to an arbitrary page and render a page number strip. The
            response carries the total row count for exactly that purpose.

            Offset paging repeats or skips a row when the list changes between two
            requests. That is accepted here: this is an operator console where a full
            refresh on the next action is the normal outcome, and being able to show
            "page 7 of 12" is worth more than a stable cursor.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Rows per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Page of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPageEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: createAccount
      summary: Create an account
      description: >
        The account must belong to a group. A caller can only place accounts
        inside its own visible subtree, otherwise the parent group is reported
        as not found.
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/accounts/{accountId}:
    patch:
      operationId: updateAccount
      summary: Update profile, group, status or timezone
      description: >
        Changing group, status or password bumps tokenVersion, so tokens issued
        before the change stop working immediately.
      tags: [accounts]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: deleteAccount
      summary: Soft-delete an account
      tags: [accounts]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/accounts/{accountId}/reset-password:
    post:
      operationId: resetAccountPassword
      summary: Set a new password and invalidate existing tokens
      tags: [accounts]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/accounts/{accountId}/roles:
    put:
      operationId: setAccountRoles
      summary: Replace the roles an account holds
      description: |
        A full replacement, not a delta: the body is the complete set. An empty
        list is accepted and leaves the account able to sign in and change its own
        profile, and nothing else.

        Two rules reject the call. The caller may only hand out roles it can see
        and only permissions it holds itself (`PERMISSION_EXCEEDED`). And the
        change may not leave the installation without an account that can
        administer roles (`ACCOUNT_LAST_ADMIN`).
      tags: [accounts]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccountRolesRequest'
      responses:
        '200':
          description: Roles replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/permissions:
    get:
      operationId: listPermissions
      summary: List every permission point this build enforces
      description: >
        The catalogue is what a role may grant, so a client renders its role editor
        from this list rather than from a hard-coded one: a permission the server
        does not enforce must not appear as a choice.
      tags: [roles]
      responses:
        '200':
          description: Permission catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/roles:
    get:
      operationId: listRoles
      summary: List the roles the caller may see
      description: >
        The root group sees every role. Everyone else sees the roles of their own
        group together with those of its ancestors, because a role defined higher
        up the tree is one they can be given.
      tags: [roles]
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: createRole
      summary: Create a role
      description: |
        `groupId` decides who the role belongs to. Omitted, it belongs to the
        caller's own group - which for a root administrator means the root group,
        and a role there is visible to the whole installation.

        Only a root group administrator may create a role for another group, and
        nobody may grant a permission they do not hold themselves.
      tags: [roles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/roles/{roleId}:
    patch:
      operationId: updateRole
      summary: Rename a role or change what it grants
      description: |
        The code is immutable: it is what a role is referred to by in logs and
        support conversations. Renaming and re-granting are allowed at any time and
        take effect on the holder's next request, because authorisation is
        resolved per request rather than stored in the token.

        A built-in role cannot be deleted, and removing a permission a holder
        relies on takes effect immediately - which is why a change that would leave
        nobody able to administer roles is rejected.
      tags: [roles]
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: deleteRole
      summary: Delete a role that nobody holds
      description: >
        Rejected with `ROLE_IN_USE` while accounts still hold it, and with
        `ROLE_BUILTIN_PROTECTED` for the two roles a fresh installation ships with:
        deleting either would silently strip permissions from whoever holds it.
      tags: [roles]
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token returned by `POST /api/v1/auth/login`. Send it as
        `Authorization: Bearer <accessToken>`.

        The token is a signed JWT, but it is not trusted on its own: every request
        re-reads the account behind it. A disabled account fails at once, a group
        that has been disabled fails with `ACCOUNT_GROUP_DISABLED`, and changing a
        password revokes every token issued before it.

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ErrorResponse:
      description: >
        Any non-2xx outcome. The envelope shape is identical to a success
        response, only `ok` is false and `error` is set instead of `data`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:

    # --- envelope -------------------------------------------------------
    EnvelopeBase:
      type: object
      required: [ok, traceId]
      properties:
        ok:
          type: boolean
        traceId:
          type: string
          description: Correlation id, always present, echoed from the X-Request-Id header when supplied.

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Uppercase snake case constant. This is the only field application
            code may branch on.
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
          description: English developer diagnostic. Never rendered to end users.
        details:
          type: object
          additionalProperties:
            type: string

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/ErrorBody'

    EmptyEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false

    # --- enums ----------------------------------------------------------
    GroupStatus:
      type: string
      enum: [ACTIVE, DISABLED]
      description: A disabled group rejects login for every account inside it.

    AccountStatus:
      type: string
      enum: [ACTIVE, DISABLED, LOCKED]

    # --- groups ---------------------------------------------------------
    GroupNode:
      type: object
      required: [id, code, name, level, status, hasChildren, accountCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        code:
          type: string
          description: >
            Speed-lookup code. Root is the empty string, level two is 000-999,
            level three concatenates another three digits, and so on up to level
            20 (57 characters). Descendant queries are prefix matches on this
            value, and ordering by it in the C collation is pre-order.
          pattern: '^([0-9]{3}){0,19}$'
        name:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 20
          description: Derived from the code length, computed by the database, never written by the application.
        status:
          $ref: '#/components/schemas/GroupStatus'
        remark:
          type: string
          nullable: true
        hasChildren:
          type: boolean
        accountCount:
          type: integer
          description: Accounts placed directly in this group.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupNodeListEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/GroupNode'

    GroupNodeEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/GroupNode'

    GroupChildren:
      type: object
      required: [items, nextAvailableCode]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupNode'
        nextAvailableCode:
          type: string
          nullable: true
          description: Next free three-digit slot, shown as a hint when creating. Null when the parent already holds 1000 children.

    GroupChildrenEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/GroupChildren'

    CreateGroupRequest:
      type: object
      required: [parentId, name]
      properties:
        parentId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          nullable: true
          pattern: '^[0-9]{3}$'
          description: Optional explicit slot. Omit to let the server allocate the next free one.
        remark:
          type: string
          maxLength: 200
          nullable: true
          description: Free text shown in the group list. Has no effect on behaviour.

    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        status:
          $ref: '#/components/schemas/GroupStatus'
        remark:
          type: string
          nullable: true
          maxLength: 255

    MoveGroupRequest:
      type: object
      required: [newParentId]
      properties:
        newParentId:
          type: string
          format: uuid

    ReorderGroupRequest:
      type: object
      required: [direction]
      properties:
        direction:
          $ref: '#/components/schemas/GroupDirection'

    GroupDirection:
      type: string
      enum: [UP, DOWN]

    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        timezone:
          type: string
          description: IANA name, e.g. Asia/Shanghai. A numeric offset is rejected.

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128

    # --- accounts -------------------------------------------------------
    Account:
      type: object
      required: [id, username, displayName, groupId, groupCode, groupName, status, timezone, roles, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        groupId:
          type: string
          format: uuid
        groupCode:
          type: string
        groupName:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        timezone:
          type: string
          description: IANA time zone name, e.g. Asia/Shanghai. Never a numeric offset.
        roles:
          type: array
          description: >
            Roles this account holds. An account with none can sign in and edit its
            own profile, and do nothing else.
          items:
            $ref: '#/components/schemas/RoleRef'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccountEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Account'

    AccountPage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        total:
          type: integer
          description: Rows matching the filter, ignoring offset and limit.
        offset:
          type: integer
          description: Offset this page was produced with, echoed back.
        limit:
          type: integer
          description: Page size this page was produced with, echoed back.

    AccountPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AccountPage'

    CreateAccountRequest:
      type: object
      required: [groupId, username, password]
      properties:
        groupId:
          type: string
          format: uuid
        username:
          type: string
          pattern: '^[A-Za-z0-9._-]{3,32}$'
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          maxLength: 64
        timezone:
          type: string
          maxLength: 64
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          description: >
            Roles to grant. Omitted means the built-in operator role: an account that
            can sign in and do nothing else looks like a broken account, so "no roles
            at all" is only reachable by assigning an empty list afterwards.

    UpdateAccountRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 64
        groupId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
        timezone:
          type: string
          maxLength: 64

    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 128

    # --- roles ----------------------------------------------------------
    RoleScope:
      type: string
      enum: [SYSTEM, GROUP]
      description: |
        SYSTEM roles belong to the root group. They are visible to every account in
        the installation, and only an administrator of the root group may change
        them. GROUP roles belong to one group, are visible inside its subtree, and
        exist for as long as that group does.

    Permission:
      type: object
      required: [code, domain, description]
      properties:
        code:
          type: string
          description: >
            Stable identifier such as `account:create`. Never localised: it is what
            a client branches on and what the server enforces.
        domain:
          type: string
          description: >
            The area the point belongs to - `group`, `account` or `role`. Used to
            group the checkboxes in a role editor; not an enum, so a new area does
            not break an older client.
        description:
          type: string
          description: >
            English developer text describing the effect. A client that translates
            `code` itself should prefer its own text and keep this as a fallback.

    PermissionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Permission'

    RoleRef:
      type: object
      description: >
        A role as it appears on an account. Deliberately not the whole role: an
        account list would otherwise carry every permission of every role on every
        row.
      required: [id, code, name, scope]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        scope:
          $ref: '#/components/schemas/RoleScope'

    Role:
      allOf:
        - $ref: '#/components/schemas/RoleRef'
        - type: object
          required: [builtin, permissions, memberCount, createdAt, updatedAt]
          properties:
            groupId:
              type: string
              format: uuid
              description: The owning group. For a SYSTEM role this is the root group.
            groupName:
              type: string
              nullable: true
            description:
              type: string
            builtin:
              type: boolean
              description: >
                Shipped by the installation rather than created by a person. Its
                code cannot change and it cannot be deleted, but what it grants can
                - that is how the two default roles stay useful.
            permissions:
              type: array
              items:
                type: string
            memberCount:
              type: integer
              description: Accounts currently holding this role, deleted ones excluded.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    RoleListEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Role'

    RoleEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Role'

    CreateRoleRequest:
      type: object
      required: [code, name, permissions]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,31}$'
          description: Lowercase, start with a letter. Immutable once created.
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 200
        groupId:
          type: string
          format: uuid
          description: >
            The owning group. Omit to use the caller's own group; only a root group
            administrator may name a different one.
        permissions:
          type: array
          items:
            type: string
          description: >
            An empty list is allowed and grants nothing beyond the ability to sign
            in. Every entry must be a point the caller holds itself.

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          nullable: true
          maxLength: 200
        permissions:
          type: array
          items:
            type: string
          description: Replaces the whole set when present.

    SetAccountRolesRequest:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          description: The complete set. An empty list removes every role.

    # --- auth -----------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128

    CurrentUser:
      type: object
      required: [id, username, displayName, groupId, groupCode, timezone, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        groupId:
          type: string
          format: uuid
        groupCode:
          type: string
        timezone:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        permissions:
          type: array
          description: >
            Every point the caller currently holds, flattened across its roles. This
            is what a client should gate its interface on: a role's name says
            nothing about what it grants, and its contents can change between two
            requests.
          items:
            type: string

    LoginResult:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
        user:
          $ref: '#/components/schemas/CurrentUser'

    LoginEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LoginResult'

    CurrentUserEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CurrentUser'
